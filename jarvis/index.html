<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020b14">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>J.A.R.V.I.S.</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">J.A.R.V.I.S.</div>
  <div class="hud"><span id="clock"></span><span id="batt"></span><button id="cfgBtn" aria-label="Sozlamalar">⚙</button></div>
</header>

<main>
  <button id="core" class="core" aria-label="Gapiring">
    <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
    <span class="dot"></span>
  </button>
  <div id="status">Ishga tushirish uchun markazni bosing</div>
  <div id="log" aria-live="polite"></div>
</main>

<form id="form">
  <input id="input" autocomplete="off" placeholder="Buyruq yozing… (masalan: Alisherga qo'ng'iroq qil)">
  <button>➤</button>
</form>

<div class="chips" id="chips"></div>

<dialog id="cfg">
  <form method="dialog">
    <h3>Sozlamalar</h3>
    <label>Til
      <select id="lang">
        <option value="uz-UZ">O'zbekcha</option>
        <option value="ru-RU">Русский</option>
        <option value="en-US">English</option>
      </select>
    </label>
    <label>Claude API kaliti (ixtiyoriy — aqlli rejim)
      <input id="key" type="password" placeholder="sk-ant-…">
    </label>
    <small>Kalit faqat shu telefonda saqlanadi. Kalitsiz oddiy buyruqlar ishlaydi.</small>
    <label>Chaqiruv so'zi (qo'lsiz rejim)
      <input id="wake" placeholder="jarvis">
    </label>
    <label class="row"><input type="checkbox" id="always"> Doim tinglash (ilova ochiq turganda)</label>
    <label class="row"><input type="checkbox" id="speak" checked> Ovozli javob</label>
    <label>Kontaktlar (har qatorda: ism=+998901234567)
      <textarea id="contacts" rows="4"></textarea>
    </label>
    <button value="ok">Saqlash</button>
  </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
