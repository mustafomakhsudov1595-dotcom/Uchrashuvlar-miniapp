name: Build Jarvis APK

on:
  push:
    branches: [ccr-146936ad-gclpro]
    paths:
      - 'jarvis-android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: jarvis-android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp jarvis-android/app/build/outputs/apk/debug/app-debug.apk Jarvis.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: Jarvis.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-latest
          name: Jarvis (Android APK)
          prerelease: true
          files: Jarvis.apk
          target_commitish: ${{ github.sha }}
