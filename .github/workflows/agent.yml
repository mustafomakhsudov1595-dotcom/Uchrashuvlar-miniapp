name: agent
on:
  workflow_dispatch:
    inputs:
      kind: { description: 'video | site | site-edit', required: true }
      prompt: { description: 'buyurtma matni', required: true }
      chat: { description: 'Telegram chat id', required: true }
      lang: { description: 'uz | ru | en', required: false, default: 'uz' }
      id: { description: 'ish id', required: false, default: '' }
      name: { description: 'sayt nomi', required: false, default: '' }
      url: { description: 'sayt linki', required: false, default: '' }
      scenes: { description: 'video ssenariy JSON', required: false, default: '' }
concurrency:
  group: agent-${{ inputs.chat }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: agent }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core ffmpeg && pip install edge-tts
      - name: Ishga tushirish
        run: python agent/run.py "$KIND"
        env:
          KIND: ${{ inputs.kind }}
          PROMPT: ${{ inputs.prompt }}
          CHAT: ${{ inputs.chat }}
          LANG_: ${{ inputs.lang }}
          ITEM_ID: ${{ inputs.id }}
          NAME: ${{ inputs.name }}
          URL: ${{ inputs.url }}
          SCENES: ${{ inputs.scenes }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
