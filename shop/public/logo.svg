<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B1A55"/><stop offset=".55" stop-color="#0E1230"/><stop offset="1" stop-color="#070A1C"/></linearGradient>
    <radialGradient id="glow" cx=".28" cy=".18" r=".75"><stop offset="0" stop-color="#6366F1" stop-opacity=".55"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx=".85" cy=".95" r=".6"><stop offset="0" stop-color="#06B6D4" stop-opacity=".35"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1C1"/><stop offset=".35" stop-color="#F6C453"/><stop offset=".7" stop-color="#C98A1B"/><stop offset="1" stop-color="#F3D27A"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7DC94" stop-opacity=".9"/><stop offset=".5" stop-color="#F7DC94" stop-opacity=".12"/><stop offset="1" stop-color="#7DD3FC" stop-opacity=".6"/></linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#7DD3FC"/><stop offset="1" stop-color="#0EA5E9"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="c"><rect width="512" height="512" rx="118"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <rect width="512" height="512" fill="url(#glow)"/><rect width="512" height="512" fill="url(#glow2)"/>
    <!-- nozik diagonal nur -->
    <path d="M-40 330 L330 -40 L420 -40 L-40 420Z" fill="#fff" opacity=".035"/>
    <circle cx="256" cy="256" r="196" fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="2"/>
  </g>
  <rect x="3" y="3" width="506" height="506" rx="115" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- C harfi: oltin yoy -->
  <g filter="url(#sh)">
    <path d="M 362 168 A 136 136 0 1 0 362 344" fill="none" stroke="url(#gold)" stroke-width="46" stroke-linecap="round"/>
  </g>
  <path d="M 362 168 A 136 136 0 1 0 362 344" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="5" stroke-linecap="round" transform="translate(-6 -6) scale(1.0)" clip-path="url(#c)" stroke-dasharray="250 2000"/>
  <!-- muzdek yulduz (chilling) -->
  <g transform="translate(300 256)">
    <path d="M0 -92 C6 -30 30 -6 92 0 C30 6 6 30 0 92 C-6 30 -30 6 -92 0 C-30 -6 -6 -30 0 -92Z" fill="#38BDF8" opacity=".55" filter="url(#gl)"/>
    <path d="M0 -92 C6 -30 30 -6 92 0 C30 6 6 30 0 92 C-6 30 -30 6 -92 0 C-30 -6 -6 -30 0 -92Z" fill="url(#ice)"/>
    <circle r="9" fill="#fff"/>
  </g>
  <g transform="translate(402 118) scale(.22)"><path d="M0 -92 C6 -30 30 -6 92 0 C30 6 6 30 0 92 C-6 30 -30 6 -92 0 C-30 -6 -6 -30 0 -92Z" fill="#F7DC94"/></g>
  <g transform="translate(150 410) scale(.13)"><path d="M0 -92 C6 -30 30 -6 92 0 C30 6 6 30 0 92 C-6 30 -30 6 -92 0 C-30 -6 -6 -30 0 -92Z" fill="#7DD3FC"/></g>
</svg>
