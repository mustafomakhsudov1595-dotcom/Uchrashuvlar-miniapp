name = "chilling-report"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

# Har yakshanba 20:00 (Toshkent, UTC+5) = 15:00 UTC
[triggers]
crons = ["0 15 * * SUN"]

# Do'kon bilan umumiy KV
[[kv_namespaces]]
binding = "KV"
id = "1a5016684d744c208a516b8d7c1dfc00"

[[rules]]
type = "Data"
globs = ["**/*.ttf", "**/*.png"]
fallthrough = true
