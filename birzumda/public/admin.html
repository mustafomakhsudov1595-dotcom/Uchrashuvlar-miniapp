<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="/favicon.png"><title>Admin — Birzumda Hotdog</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --red:#d9261c; --yellow:#ffd213; --ink:#3a0f0b; --bg:#fff6d6; --line:#e8dccb; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font:15px/1.4 system-ui,-apple-system,'Segoe UI',sans-serif; background:var(--bg); color:var(--ink); padding-bottom:30px; }
  header { background:var(--yellow); color:var(--ink); border-bottom:3px solid var(--red); padding:12px 16px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:5; }
  header b { color:var(--red); } header img { width:30px; height:30px; border-radius:50%; vertical-align:middle; margin-right:6px; }
  main { max-width:900px; margin:0 auto; padding:12px; }
  button { font:inherit; cursor:pointer; border:0; border-radius:10px; padding:9px 14px; background:var(--ink); color:#fff; }
  button.red { background:var(--red); } button.ghost { background:#e8dccb; color:var(--ink); } button.sm { padding:6px 10px; font-size:13px; }
  input, select { font:inherit; padding:9px 11px; border:1.5px solid var(--line); border-radius:10px; background:#fff; min-width:0; }
  input:focus { outline:none; border-color:var(--red); }
  .tabs { display:flex; gap:6px; margin-bottom:12px; overflow-x:auto; scrollbar-width:none; }
  .tabs button { background:#e8dccb; color:var(--ink); flex:none; } .tabs button.on { background:var(--red); color:#fff; }
  .card { background:#fff; border-radius:14px; padding:12px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.07); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1; min-width:110px; }
  .muted { color:#7a6a60; font-size:13px; }
  .tag { display:inline-block; padding:2px 9px; border-radius:99px; background:#eee; font-size:12px; font-weight:600; }
  .tag.new { background:#ffe3e0; color:var(--red); } .tag.done { background:#dff5e3; color:#1b8a3a; } .tag.off { background:#ddd; }
  .login { max-width:340px; margin:70px auto; padding:0 16px; text-align:center; } .login input { width:100%; margin:12px 0; }
  .err { color:var(--red); min-height:20px; }
  h3 { margin:16px 0 8px; display:flex; align-items:center; gap:8px; }
  .item { border-top:1px solid var(--line); padding:8px 0; display:grid; grid-template-columns:1fr 100px; gap:6px; }
  .item:first-child { border-top:0; }
  .item .full { grid-column:1 / -1; } .item input { width:100%; }
  .add { background:#fff8e1; border:1.5px dashed var(--yellow); border-radius:12px; padding:10px; margin-top:8px; display:grid; grid-template-columns:1fr 100px; gap:6px; }
  .add input { width:100%; } .add button { grid-column:1 / -1; }
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <img src="/img/logo.png" alt="" style="width:110px;border-radius:50%"><h2>Birzumda Admin</h2>
  <p class="muted">Faqat adminlar uchun. Telegram'da botga <b>/admin PAROL</b> deb yozsangiz, shu ilova avtomatik ochiladi. Yoki parolni shu yerga kiriting.</p>
  <input id="pw" type="password" placeholder="Parol" autocomplete="current-password" />
  <div class="err" id="err"></div>
  <button class="red" id="loginBtn" style="width:100%">Kirish</button>
</div>
<div id="panel" hidden>
  <header><span><img src="/img/logo.png" alt=""><b>Birzumda</b> admin</span><button class="ghost sm" id="logout">Chiqish</button></header>
  <main>
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </main>
</div>
<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const STATUS = { new:'🆕 Yangi', accepted:'👨‍🍳 Qabul', delivering:'🛵 Yo\'lda', done:'✅ Yetkazildi', cancelled:'❌ Bekor' };
let token = sessionStorage.getItem('bz_admin') || '', S = null, tab = 'orders';
const val = (id) => $(id).value;

async function call(path, body) {
  const r = await fetch('/api/admin/' + path, { method: body ? 'POST' : 'GET', headers: { 'Content-Type':'application/json', Authorization:'Bearer ' + token, 'X-Init-Data': tg?.initData || '' }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json();
  if (r.status === 401) { sessionStorage.removeItem('bz_admin'); token = ''; showLogin(); throw new Error(d.error); }
  if (!r.ok) { (tg?.showAlert || alert)(d.error || 'Xatolik'); throw new Error(d.error); }
  return d;
}
function showLogin() { $('login').hidden = false; $('panel').hidden = true; }
async function refresh() { S = await call('state'); $('login').hidden = true; $('panel').hidden = false; render(); }

$('loginBtn').onclick = async () => {
  const r = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: val('pw') }) });
  const d = await r.json();
  if (!r.ok) { $('err').textContent = d.error; return; }
  token = d.token; sessionStorage.setItem('bz_admin', token); $('pw').value = ''; refresh();
};
$('pw').onkeydown = (e) => { if (e.key === 'Enter') $('loginBtn').click(); };
$('logout').onclick = () => { sessionStorage.removeItem('bz_admin'); token = ''; tg ? tg.close() : showLogin(); };

const TABS = { orders:'📦 Buyurtmalar', menu:'🍽 Mahsulotlar', promos:'🎟 Promokod', settings:'⚙️ Sozlamalar', admins:'👥 Adminlar' };
function render() {
  $('tabs').innerHTML = Object.entries(TABS).map(([k, v]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${v}</button>`).join('');
  $('view').innerHTML = { orders, promos, menu, settings, admins }[tab]();
}
$('tabs').onclick = (e) => { const t = e.target.dataset.tab; if (t) { tab = t; render(); } };

function orders() {
  const head = `<div class="row" style="margin-bottom:10px"><button class="ghost sm" onclick="refresh()">↻ Yangilash</button></div>`;
  if (!S.orders.length) return head + '<div class="card muted">Hozircha buyurtma yo\'q.</div>';
  return head + S.orders.map((o) => `
    <div class="card"><div class="row"><b class="grow">#${o.id} · ${esc(o.name)}</b><span class="tag ${o.status === 'new' ? 'new' : o.status === 'done' ? 'done' : ''}">${STATUS[o.status]}</span></div>
    <div class="muted">${new Date(o.createdAt).toLocaleString('uz-UZ')} · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a> · ${o.type === 'delivery' ? '🛵 ' + esc(o.address) : '🏃 Olib ketish'}</div>
    <div style="margin:8px 0">${o.items.map((i) => `${esc(i.name)} × ${i.qty}`).join('<br>')}</div>
    ${o.comment ? `<div class="muted">💬 ${esc(o.comment)}</div>` : ''}
    <div><b>${fmt(o.total)} so'm</b>${o.promo ? ` <span class="muted">(${esc(o.promo.code)} −${o.promo.percent}% = −${fmt(o.discount)})</span>` : ''}</div>
    <div class="row" style="margin-top:8px">${Object.entries(STATUS).filter(([k]) => k !== 'new' && k !== o.status).map(([k, v]) => `<button class="sm ${k === 'cancelled' ? 'ghost' : ''}" onclick="setStatus(${o.id},'${k}')">${v}</button>`).join('')}</div></div>`).join('');
}
async function setStatus(id, status) { await call('order-status', { id, status }); refresh(); }

function promos() {
  return `<div class="card"><b>Yangi promokod</b>
    <div class="row" style="margin-top:8px"><input id="pCode" class="grow" placeholder="Kod (BIRZUMDA10)" maxlength="20" style="text-transform:uppercase"><input id="pPct" type="number" inputmode="numeric" min="1" max="100" placeholder="Chegirma %" style="width:110px"></div>
    <div class="row" style="margin-top:8px"><span class="grow">Bir kishi necha marta ishlatadi?</span><input id="pPer" type="number" inputmode="numeric" min="0" value="1" style="width:80px"><button class="red" onclick="addPromo()">Qo'shish</button></div>
    <div class="muted" style="margin-top:6px">Mijoz kodni yozsa, summadan shu foiz avtomatik ayriladi. Limit: 1 = bir kishi bir marta; 0 = cheklovsiz. Mavjud kodni qayta kiritsangiz, foiz va limit yangilanadi.</div></div>
    ${S.promos.length ? S.promos.map((p) => `<div class="card row"><b class="grow">${esc(p.code)} — ${p.percent}%</b><span class="muted">${p.used || 0} marta ishlatilgan · limit: ${p.perUser > 0 ? 'kishi boshiga ' + p.perUser : 'cheksiz'}</span><span class="tag ${p.active ? 'done' : 'off'}">${p.active ? 'Faol' : 'O\'chiq'}</span><button class="ghost sm" onclick="togglePromo('${esc(p.code)}')">${p.active ? 'O\'chirib qo\'yish' : 'Yoqish'}</button><button class="sm" onclick="delPromo('${esc(p.code)}')">🗑</button></div>`).join('') : '<div class="card muted">Promokod yo\'q.</div>'}`;
}
async function addPromo() { await call('promos', { code: val('pCode'), percent: val('pPct'), perUser: val('pPer') }); refresh(); }
async function togglePromo(code) { await call('promos/toggle', { code }); refresh(); }
async function delPromo(code) { if (confirm(code + ' o\'chirilsinmi?')) { await call('promos/delete', { code }); refresh(); } }

function menu() {
  return `<div class="card"><b>Yangi kategoriya</b><div class="row" style="margin-top:8px"><input id="cEmoji" value="🍽" style="width:60px" maxlength="4"><input id="cName" class="grow" placeholder="Nomi (masalan: Ichimliklar)" maxlength="40"><button class="red" onclick="addCat()">Qo'shish</button></div></div>` +
  S.menu.map((c) => `<h3><span class="grow">${esc(c.emoji)} ${esc(c.name)}</span><button class="ghost sm" onclick="delCat('${c.id}')">🗑 kategoriya</button></h3>
    <div class="card">${c.items.map((i) => `<div class="item">
      <input value="${esc(i.name)}" onchange="saveItem('${i.id}',{name:this.value})">
      <input type="number" inputmode="numeric" value="${i.price}" onchange="saveItem('${i.id}',{price:this.value})">
      <input class="full" placeholder="Tavsif (ixtiyoriy)" value="${esc(i.desc || '')}" onchange="saveItem('${i.id}',{desc:this.value})">
      <div class="row full">${i.img ? `<img src="${esc(i.img)}" style="width:56px;height:56px;object-fit:cover;border-radius:10px">` : ''}<button class="sm ghost" onclick="photo(u=>saveItem('${i.id}',{img:u}))">📷 ${i.img ? 'Rasmni almashtirish' : 'Rasm yuklash'}</button>${i.img ? `<button class="sm ghost" onclick="saveItem('${i.id}',{img:''})">✖ Rasmsiz</button>` : ''}</div>
      <div class="row full"><button class="sm ${i.available ? '' : 'ghost'}" onclick="saveItem('${i.id}',{available:${!i.available}})">${i.available ? '✅ Bor' : '⛔ Tugagan'}</button><button class="sm ghost" onclick="delItem('${i.id}')">🗑 O'chirish</button></div></div>`).join('') || '<div class="muted">Mahsulot yo\'q.</div>'}
      <div class="add"><input id="n-${c.id}" placeholder="Yangi mahsulot nomi" maxlength="60"><input id="p-${c.id}" type="number" inputmode="numeric" placeholder="Narx">
        <input id="d-${c.id}" placeholder="Tavsif (ixtiyoriy)" maxlength="120"><button class="ghost" id="ib-${c.id}" onclick="photo(u=>{newImg['${c.id}']=u;$('ib-${c.id}').textContent='✅ Rasm tanlandi'})">📷 Rasm yuklash</button><button class="red" onclick="addItem('${c.id}')">+ Mahsulot qo'shish</button></div></div>`).join('');
}
const newImg = {};
// Rasm tanlash -> brauzerda kichraytirish (max 900px, JPEG) -> serverga yuklash
function photo(done) {
  const f = document.createElement('input'); f.type = 'file'; f.accept = 'image/*';
  f.onchange = async () => {
    const file = f.files[0]; if (!file) return;
    try {
      const bmp = await createImageBitmap(file); const k = Math.min(1, 900 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.82));
      const r = await fetch('/api/admin/upload', { method: 'POST', headers: { Authorization: 'Bearer ' + token, 'X-Init-Data': tg?.initData || '' }, body: blob });
      const d = await r.json(); if (!r.ok) throw new Error(d.error);
      done(d.url);
    } catch (e) { (tg?.showAlert || alert)(e.message || 'Rasmni yuklab bo\'lmadi'); }
  };
  f.click();
}
async function saveItem(id, patch) { const d = await call('item', { id, ...patch }); S.menu = d.menu; render(); }
async function addItem(cat) { const d = await call('item/add', { cat, name: val('n-' + cat), price: val('p-' + cat), desc: val('d-' + cat), img: newImg[cat] || '' }); delete newImg[cat]; S.menu = d.menu; render(); }
async function delItem(id) { if (confirm('Mahsulot o\'chirilsinmi?')) { const d = await call('item/delete', { id }); S.menu = d.menu; render(); } }
async function addCat() { const d = await call('cat/add', { name: val('cName'), emoji: val('cEmoji') }); S.menu = d.menu; render(); }
async function delCat(id) { if (confirm('Kategoriya va undagi barcha mahsulotlar o\'chirilsinmi?')) { const d = await call('cat/delete', { id }); S.menu = d.menu; render(); } }

function settings() {
  const s = S.settings;
  return `<div class="card"><div class="row"><b class="grow">Buyurtma qabul qilish</b><button class="sm ${s.open ? '' : 'ghost'}" onclick="saveSettings({open:${!s.open}})">${s.open ? '🟢 Ochiq' : '🔴 Yopiq'}</button></div></div>
  <div class="card">${[['phone','Telefon'],['address','Manzil'],['hours','Ish vaqti']].map(([k, l]) => `<div class="row" style="margin-bottom:8px"><span style="width:80px">${l}</span><input class="grow" value="${esc(s[k])}" onchange="saveSettings({${k}:this.value})"></div>`).join('')}
    <div class="row"><span style="width:80px">Min. summa</span><input class="grow" type="number" inputmode="numeric" value="${s.minOrder}" onchange="saveSettings({minOrder:this.value})"></div></div>`;
}
async function saveSettings(patch) { const d = await call('settings', patch); S.settings = d.settings; render(); }

function admins() {
  return `<div class="card muted">Yangi admin qo'shish: u botga <b>/admin PAROL</b> deb yozadi. Shundan so'ng Telegram'da unga admin ilova ochiladi va buyurtmalar xabari keladi. Admin bo'lmagan odamlar bu ilovaga kira olmaydi (parolsiz).</div>` +
    (S.admins.length ? S.admins.map((a) => `<div class="card row"><b class="grow">${esc(a.name)}</b><span class="muted">ID ${a.id}</span><button class="ghost sm" onclick="rmAdmin(${a.id})">Olib tashlash</button></div>`).join('') : '<div class="card muted">Hozircha Telegram admin yo\'q.</div>');
}
async function rmAdmin(id) { if (confirm('Admin huquqi olib tashlansinmi?')) { const d = await call('admins/remove', { id }); S.admins = d.admins; render(); } }

setInterval(() => { if (!$('panel').hidden && tab === 'orders' && !document.hidden) refresh().catch(() => {}); }, 20000);
refresh().catch(() => showLogin()); // Telegram adminlari avtomatik kiradi, boshqalar parol kiritadi
</script>
</body>
</html>
