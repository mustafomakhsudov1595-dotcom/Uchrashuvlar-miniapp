<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Birzumda Hotdog</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="theme-color" content="#FFD213" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <header class="brand">
      <img class="logo" src="/img/logo.png" alt="Birzumda Xot Dog" />
      <h1>Birzumda Xot Dog</h1>
      <p>Xot-dog · Lavash · Non burger · KFC</p>
      <div class="hero-info" id="info"></div>
    </header>
    <img class="promo-banner" src="/img/banner.jpg" alt="Mazali Fast Food" />
    <nav class="stories" id="stories"></nav>
    <div class="closed" id="closed" hidden>Hozir buyurtma qabul qilinmayapti 🌙</div>
    <main id="menu"></main>
    <section class="gallery">
      <h2>Bizdan ko'rinishlar 📸</h2>
      <div class="grid">
        <img loading="lazy" src="/img/lavash.jpg" alt="Lavash" />
        <img loading="lazy" src="/img/hotdog.jpg" alt="Pishloqli xot-dog" />
        <img loading="lazy" src="/img/hotdog-steps.jpg" alt="Xot-dog qanday tayyorlanadi" />
        <img loading="lazy" src="/img/aksiya.jpg" alt="Aksiya" />
        <img loading="lazy" src="/img/cafe.jpg" alt="Cafe" />
        <img loading="lazy" src="/img/car.jpg" alt="Dostavka" />
      </div>
    </section>
    <footer id="footer"></footer>
  </div>

  <button class="cart-bar" id="cartBar" hidden></button>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-bg" data-close></div>
    <div class="sheet-body">
      <div class="sheet-head"><b id="sheetTitle">Savat</b><button data-close aria-label="Yopish">✕</button></div>
      <div id="sheetContent"></div>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
