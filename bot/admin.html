<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Hisobot</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#08150f;--bg2:#0c1d15;--card:#122b20;--line:rgba(255,255,255,.09);--ink:#f4f0e6;--ink2:#a7b8ae;--ink3:#8ea296;--gold:#d9b46a;--gold2:#f3dca4;--s1:#d9b46a;--on:#08150f;--wash:rgba(217,180,106,.13);--good:#86b573;--warn:#e8a94a;--crit:#e0735f;--good-bg:rgba(134,181,115,.18);--warn-bg:rgba(232,169,74,.18);--crit-bg:rgba(224,115,95,.18);--bar:linear-gradient(180deg,#f3dca4,#d9b46a);--barh:linear-gradient(90deg,#d9b46a,#f3dca4);--serif:'Fraunces',Georgia,serif;--sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(520px 420px at 108% -6%,rgba(134,181,115,.22),transparent 70%),radial-gradient(460px 380px at -12% 106%,rgba(217,180,106,.13),transparent 70%)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg{display:block;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{position:sticky;top:0;z-index:5;padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(8,21,15,.84);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand>div:last-child{min-width:0}
.brand i{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--on);font:700 18px/1 var(--serif);font-style:normal}
.top h1{font:600 22px/1.1 var(--serif);margin:0;letter-spacing:-.01em}
.top .sub{font-size:12px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbtn{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.04);border:1px solid var(--line);display:grid;place-items:center;color:var(--gold2)}
.rbtn.spin svg{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
main{max-width:640px;margin:0 auto;padding:6px 16px calc(96px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(12,29,21,.92);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tab{position:relative;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink3);border-radius:14px}
.tab[aria-selected="true"]{color:var(--gold2);font-weight:800}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:-7px;width:28px;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
h2{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:26px 2px 10px;font-weight:800}
h2::before{content:"";width:28px;height:1px;background:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 14px 30px -18px rgba(0,0,0,.65)}
.pad{padding:16px}
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -16px;padding:4px 16px 10px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;scroll-snap-align:start;width:60px;min-height:84px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.dchip .w{font-size:11px;color:var(--ink2);font-weight:700}
.dchip .n{font:600 22px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.dchip .c{min-width:20px;height:18px;border-radius:9px;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 6px;background:var(--wash);color:var(--gold2)}
.dchip .c.z{background:transparent;color:var(--ink3);font-weight:500}
.dchip[aria-pressed="true"]{background:linear-gradient(135deg,var(--gold2),var(--gold));border-color:transparent;box-shadow:0 12px 28px -12px rgba(217,180,106,.65)}
.dchip[aria-pressed="true"] .w,.dchip[aria-pressed="true"] .n,.dchip[aria-pressed="true"] .c{color:var(--on)}
.dchip[aria-pressed="true"] .c{background:rgba(8,21,15,.16)}
.sum{background:linear-gradient(160deg,#16352a,var(--card));border-color:rgba(217,180,106,.28)}
.sum .d{font:600 22px/1.15 var(--serif);letter-spacing:-.01em}
.sum .chip{font:800 10px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--wash);color:var(--gold2);margin-left:10px;vertical-align:4px;border:1px solid rgba(217,180,106,.35)}
.sum .m{font-size:13px;color:var(--ink2);margin-top:4px}
.occ{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:var(--ink2);font-weight:600}
.track{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
.fill{height:100%;background:var(--barh);border-radius:4px}
.slots{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.slot{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start}
.slot .t{font:600 15px/1 var(--serif);font-variant-numeric:tabular-nums;color:var(--ink2);padding-top:18px}
.free{min-height:44px;border:1px dashed rgba(255,255,255,.14);border-radius:14px;display:flex;align-items:center;padding:0 14px;font-size:13px;color:var(--ink3)}
.bk{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:16px;margin-bottom:8px;width:100%;text-align:left;box-shadow:0 12px 26px -18px rgba(0,0,0,.7)}
.bk.ok{border-left-color:var(--good)}.bk.new{border-left-color:var(--warn)}.bk.no{border-left-color:var(--crit);opacity:.7}
.bk .main{flex:1;min-width:0;padding:11px 0 11px 14px;min-height:60px}
.bk .nm{font-weight:700;overflow-wrap:anywhere}
.bk .tp{font-size:12px;color:var(--ink2);margin-top:1px;overflow-wrap:anywhere}
.call{flex:0 0 auto;width:44px;height:44px;margin-right:6px;border-radius:50%;display:grid;place-items:center;color:var(--on);background:linear-gradient(135deg,var(--gold2),var(--gold));text-decoration:none}
.call svg{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;margin-top:6px;color:var(--ink)}
.pill.ok{background:var(--good-bg)}.pill.new{background:var(--warn-bg)}.pill.no{background:var(--crit-bg)}
.warnnote{font-size:12px;color:var(--ink2);margin-top:5px}
.search{position:relative;margin-bottom:10px}
.search svg{position:absolute;left:14px;top:12px;width:20px;height:20px;color:var(--ink3);pointer-events:none}
.search input{width:100%;min-height:46px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);padding:0 16px 0 44px;font:inherit}
.search input::placeholder{color:var(--ink3)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 6px;padding:0 16px 4px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:14px;font-weight:600;white-space:nowrap}
.chips button[aria-pressed="true"]{border-color:rgba(217,180,106,.55);background:var(--wash);color:var(--gold2);font-weight:800}
.chips button b{font-variant-numeric:tabular-nums;color:var(--ink2);font-weight:700;margin-left:5px}
.chips button[aria-pressed="true"] b{color:var(--gold2)}
.grp{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:800;margin:18px 4px 8px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;margin-bottom:8px;min-height:68px}
.av{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--wash);border:1px solid rgba(217,180,106,.3);display:grid;place-items:center;font:600 15px/1 var(--serif);color:var(--gold2)}
.item .body{flex:1;min-width:0}
.item .nm{font-weight:700;overflow-wrap:anywhere}
.item .sub{font-size:12px;color:var(--ink2);margin-top:1px;overflow-wrap:anywhere}
.item .when{font-size:12px;color:var(--ink);margin-top:4px;font-weight:700}
.item .side{flex:0 0 auto;align-self:flex-start}
.item .side .pill{margin-top:0;white-space:nowrap}
.src{color:var(--ink3);font-weight:500}
.hero{position:relative;overflow:hidden;padding:22px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;background:linear-gradient(150deg,#1a4030,var(--card) 60%);border-color:rgba(217,180,106,.35)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(217,180,106,.14);filter:blur(30px);pointer-events:none}
.hero b{font:600 60px/1 var(--serif);font-variant-numeric:tabular-nums;letter-spacing:-.03em;background:linear-gradient(110deg,var(--gold2),var(--gold) 60%,#b98a42);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero span{display:block;font-size:13px;color:var(--ink2);margin-top:8px;font-weight:600}
.hero .today{position:relative;z-index:1;font-size:13px;color:var(--gold2);background:var(--wash);border:1px solid rgba(217,180,106,.35);padding:7px 12px;border-radius:999px;font-weight:800;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.kpi{padding:14px 10px 12px}
.kpi b{display:block;font:600 28px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.kpi span{display:flex;align-items:center;font-size:12px;color:var(--ink2);margin-top:5px;white-space:nowrap;font-weight:600}
.kpi i{flex:0 0 auto;width:8px;height:8px;border-radius:4px;margin-right:6px}
.cols{display:flex;align-items:flex-end;gap:4px;height:156px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.col .v{font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums;margin-bottom:3px;font-weight:700}
.col .bar{width:100%;max-width:24px;background:var(--bar);border-radius:5px 5px 0 0;min-height:2px}
.col .bar.zero{background:rgba(255,255,255,.12)}
.col .x{font-size:10px;color:var(--ink3);margin-top:6px;text-align:center;line-height:1.15;white-space:pre-line;font-weight:600}
.col.today .x{color:var(--gold2);font-weight:800}
.axis{height:1px;background:var(--line);margin-top:-1px}
.bars .r{margin-bottom:14px}.bars .r:last-child{margin-bottom:0}
.bars .l{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:6px;font-weight:600}
.bars .l span:last-child{font:600 16px/1 var(--serif);font-variant-numeric:tabular-nums;color:var(--gold2)}
.bars .tr{height:10px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--barh);border-radius:0 5px 5px 0}
.empty{padding:38px 20px;text-align:center;color:var(--ink2)}
.empty .ic{width:52px;height:52px;border-radius:50%;background:var(--wash);border:1px solid rgba(217,180,106,.3);display:grid;place-items:center;margin:0 auto 12px;color:var(--gold2)}
.empty b{display:block;color:var(--ink);font:600 18px var(--serif);margin-bottom:4px}
.msg{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--ink2)}
.msg h2{display:block;font:600 24px/1.15 var(--serif);text-transform:none;letter-spacing:0;color:var(--ink);margin:14px 0 6px}
.msg h2::before{display:none}
.btn{min-height:48px;padding:0 24px;border-radius:999px;background:linear-gradient(120deg,var(--gold2),var(--gold));color:var(--on);font-weight:800;margin-top:18px;box-shadow:0 12px 34px -12px rgba(217,180,106,.6)}
.sk{height:84px;border-radius:20px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(2,8,5,.62);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:640px;margin:0 auto;background:var(--bg2);border:1px solid rgba(217,180,106,.3);border-bottom:0;border-radius:26px 26px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;transform:translateY(105%);visibility:hidden;transition:transform .24s ease,visibility 0s linear .24s}
.sheet.on{transform:none;visibility:visible;transition:transform .24s ease,visibility 0s}
.grab{width:42px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:4px auto 14px}
.sheet h3{font:600 26px/1.15 var(--serif);margin:0;letter-spacing:-.01em;overflow-wrap:anywhere}
.dl{margin:16px 0 0}
.dl div{display:grid;grid-template-columns:100px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.dl dt{font-size:13px;color:var(--ink3);font-weight:600}
.dl dd{margin:0;overflow-wrap:anywhere;font-weight:600}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border-radius:999px;background:linear-gradient(120deg,var(--gold2),var(--gold));color:var(--on);font-weight:800;text-decoration:none;margin-top:16px;box-shadow:0 14px 36px -14px rgba(217,180,106,.7)}
.big svg{width:20px;height:20px}
.close{width:100%;min-height:48px;margin-top:8px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-weight:700}
@media (prefers-reduced-motion:reduce){.sheet,.sheet.on{transition:none}.rbtn.spin svg,.sk{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><i>A</i><div><h1>Hisobot</h1><div class="sub" id="sub">Dr. Avazxon</div></div></div>
  <button class="rbtn" id="refresh" aria-label="Yangilash"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></button>
</header>
<main id="view"><div class="sk"></div><div class="sk"></div><div class="sk"></div></main>
<nav class="tabs" role="tablist" aria-label="Bo‘limlar" id="tabs"></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Ariza ma’lumoti"></div>
<script>
(function(){
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#08150f'); tg.setBackgroundColor('#08150f'); tg.setBottomBarColor('#0c1d15'); } catch (e) {} }

var MONTHS = ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
var WD = ['yakshanba','dushanba','seshanba','chorshanba','payshanba','juma','shanba'];
var WDS = ['Ya','Du','Se','Ch','Pa','Ju','Sh'];
var STATUS = { 'new': { i: '⏳', l: 'Kutilmoqda' }, ok: { i: '✅', l: 'Tasdiqlangan' }, no: { i: '❌', l: 'Rad etilgan' } };
var ICON = {
  cal: '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  list: '<svg viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.6" cy="6.5" r="1"/><circle cx="4.6" cy="12" r="1"/><circle cx="4.6" cy="17.5" r="1"/></svg>',
  chart: '<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  phone: '<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
  search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
  empty: '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4M9 15h6"/></svg>',
  lock: '<svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>'
};
var TABS = [['jadval', 'Jadval', 'cal'], ['arizalar', 'Arizalar', 'list'], ['stat', 'Statistika', 'chart']];
var state = { data: null, tab: 'jadval', day: null, filter: 'all', q: '', at: null };
var view = document.getElementById('view');

function $(id) { return document.getElementById(id); }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function add(p) { for (var i = 1; i < arguments.length; i++) if (arguments[i]) p.appendChild(arguments[i]); return p; }
function icon(name, cls) { var s = el('span', cls); s.innerHTML = ICON[name]; return s; }
function two(n) { return n < 10 ? '0' + n : '' + n; }
function tzNow() { return new Date(Date.now() + 5 * 3600000); }
function todayISO() { return tzNow().toISOString().slice(0, 10); }
function addDays(iso, n) { var d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function dparts(iso) { var d = new Date(iso + 'T00:00:00Z'); return { d: d.getUTCDate(), m: d.getUTCMonth(), w: d.getUTCDay() }; }
function dshort(iso) { var p = dparts(iso); return p.d + '-' + MONTHS[p.m]; }
function dlabel(iso) { var p = dparts(iso); return p.d + '-' + MONTHS[p.m] + ', ' + WD[p.w]; }
function stamp(ms) { var d = new Date(ms + 5 * 3600000); return two(d.getUTCDate()) + '.' + two(d.getUTCMonth() + 1) + '.' + d.getUTCFullYear() + ' ' + two(d.getUTCHours()) + ':' + two(d.getUTCMinutes()); }
function phoneHref(p) { return 'tel:' + String(p || '').replace(/[^+\d]/g, ''); }
function tick() { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} }
function initials(n) { var p = String(n || '?').trim().split(/\s+/); return ((p[0] || '?').charAt(0) + (p[1] ? p[1].charAt(0) : '')).toUpperCase(); }
function workDays(today, n) { var out = [], cur = today; for (var i = 0; out.length < n && i < 30; i++) { if (dparts(cur).w !== 0) out.push(cur); cur = addDays(cur, 1); } return out; }
function pill(s) { var st = STATUS[s] || STATUS['new']; return el('span', 'pill ' + (STATUS[s] ? s : 'new'), st.i + ' ' + st.l); }

function message(title, text, btn) {
  view.textContent = '';
  var m = el('div', 'msg'); var ic = icon('lock'); ic.firstChild.style.cssText = 'width:48px;height:48px;color:var(--gold)';
  add(m, ic, el('h2', null, title), el('div', null, text));
  if (btn) { var b = el('button', 'btn', btn); b.onclick = load; m.appendChild(b); }
  view.appendChild(m); $('tabs').style.display = 'none';
}

function load() {
  if (!tg || !tg.initData) { message('Telegram ichida oching', 'Hisobot faqat Telegram botdagi «📊 Hisobot» tugmasi orqali ochiladi.'); return; }
  $('refresh').classList.add('spin');
  fetch('/admin/api/bookings', { headers: { Authorization: 'tma ' + tg.initData }, cache: 'no-store' })
    .then(function (r) {
      if (r.status === 403) { message('Ruxsat yo‘q', 'Bu bo‘lim faqat adminlar uchun.'); return null; }
      if (r.status === 401) { message('Qayta oching', 'Sessiya eskirgan. Hisobotni botdan qaytadan oching.'); return null; }
      if (!r.ok) throw new Error('http');
      return r.json();
    })
    .then(function (j) { if (j) { state.data = j; state.at = Date.now(); $('tabs').style.display = ''; render(); } })
    .catch(function () { if (state.data) { render(); } else { message('Yuklab bo‘lmadi', 'Internetni tekshirib, qayta urinib ko‘ring.', 'Qayta urinish'); } })
    .then(function () { $('refresh').classList.remove('spin'); });
}

function drawTabs() {
  var nav = $('tabs'); nav.textContent = '';
  TABS.forEach(function (t) {
    var b = el('button', 'tab'); b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', state.tab === t[0] ? 'true' : 'false');
    add(b, icon(t[2]), el('span', null, t[1]));
    b.onclick = function () { if (state.tab !== t[0]) { state.tab = t[0]; tick(); render(); window.scrollTo(0, 0); } };
    nav.appendChild(b);
  });
}

/* ---------- Jadval ---------- */
function bookingCard(b, clash) {
  var card = el('div', 'bk ' + (STATUS[b.s] ? b.s : 'new'));
  var main = el('button', 'main'); main.style.cssText = 'text-align:left;background:none;border:0;cursor:pointer;color:inherit;font:inherit';
  add(main, el('div', 'nm', b.n || '—'), el('div', 'tp', b.t || ''), pill(b.s));
  if (clash) add(main, el('div', 'warnnote', '⚠️ Shu vaqtga yana bir ariza bor'));
  main.onclick = function () { openSheet(b); };
  var call = el('a', 'call'); call.href = phoneHref(b.p); call.setAttribute('aria-label', 'Qo‘ng‘iroq: ' + (b.p || '')); call.appendChild(icon('phone'));
  return add(card, main, call);
}

function renderSchedule(all, slots, today) {
  var days = workDays(today, 11);
  if (!state.day || days.indexOf(state.day) < 0) state.day = days[0];
  var cnt = {}; all.forEach(function (b) { if (b.d && b.s !== 'no') cnt[b.d] = (cnt[b.d] || 0) + 1; });

  var strip = el('div', 'strip'); strip.setAttribute('role', 'group'); strip.setAttribute('aria-label', 'Kunni tanlang');
  days.forEach(function (iso) {
    var p = dparts(iso), n = cnt[iso] || 0;
    var b = el('button', 'dchip'); b.setAttribute('aria-pressed', iso === state.day ? 'true' : 'false'); b.setAttribute('data-iso', iso);
    b.setAttribute('aria-label', dlabel(iso) + ': ' + n + ' ta ariza');
    add(b, el('span', 'w', iso === today ? 'Bugun' : WDS[p.w]), el('span', 'n', String(p.d)), el('span', 'c' + (n ? '' : ' z'), n ? String(n) : '·'));
    b.onclick = function () { state.day = iso; tick(); render(); };
    strip.appendChild(b);
  });
  view.appendChild(strip);

  var iso = state.day;
  var dayAll = all.filter(function (b) { return b.d === iso; });
  var live = dayAll.filter(function (b) { return b.s !== 'no'; });
  var byTime = {}; dayAll.forEach(function (b) { (byTime[b.h] = byTime[b.h] || []).push(b); });
  var busy = 0; slots.forEach(function (h) { if ((byTime[h] || []).some(function (b) { return b.s !== 'no'; })) busy++; });

  var sum = el('div', 'card pad sum');
  var d = el('div', 'd', dlabel(iso));
  if (iso === today) add(d, el('span', 'chip', 'Bugun')); else if (iso === addDays(today, 1)) add(d, el('span', 'chip', 'Ertaga'));
  add(sum, d, el('div', 'm', live.length ? live.length + ' ta ariza' : 'Bu kunga ariza yo‘q'));
  var occ = el('div', 'occ'), tr = el('div', 'track'), f = el('div', 'fill');
  f.style.width = (slots.length ? Math.min(100, busy / slots.length * 100) : 0) + '%';
  add(tr, f); add(occ, tr, el('span', null, 'Band ' + busy + '/' + slots.length + ' soat')); sum.appendChild(occ);
  view.appendChild(sum);

  var list = el('div', 'slots');
  var known = {};
  slots.forEach(function (h) {
    known[h] = 1;
    var row = el('div', 'slot'); add(row, el('div', 't', h));
    var cell = el('div'); var items = (byTime[h] || []).slice().sort(function (a, b) { return a.at - b.at; });
    var liveN = items.filter(function (b) { return b.s !== 'no'; }).length;
    if (!items.length) add(cell, el('div', 'free', 'Bo‘sh'));
    else items.forEach(function (b) { cell.appendChild(bookingCard(b, b.s !== 'no' && liveN > 1)); });
    row.appendChild(cell); list.appendChild(row);
  });
  var other = dayAll.filter(function (b) { return !known[b.h]; });
  if (other.length) {
    var row = el('div', 'slot'); add(row, el('div', 't', '···')); var cell = el('div');
    other.forEach(function (b) { cell.appendChild(bookingCard(b, false)); }); row.appendChild(cell); list.appendChild(row);
  }
  view.appendChild(list);
  setTimeout(function () { var a = strip.querySelector('[aria-pressed="true"]'); if (a && a.scrollIntoView) { try { a.scrollIntoView({ inline: 'center', block: 'nearest' }); } catch (e) {} } }, 0);
}

/* ---------- Arizalar ---------- */
function matches(b) {
  if (state.filter !== 'all' && b.s !== state.filter) return false;
  var q = state.q.trim().toLowerCase();
  return !q || ((b.n || '') + ' ' + (b.p || '') + ' ' + (b.t || '')).toLowerCase().indexOf(q) >= 0;
}
function groupName(ms, today) {
  var iso = new Date(ms + 5 * 3600000).toISOString().slice(0, 10);
  if (iso === today) return 'Bugun'; if (iso === addDays(today, -1)) return 'Kecha'; return dshort(iso);
}
function renderList(all, today) {
  var cnt = { all: all.length, 'new': 0, ok: 0, no: 0 }; all.forEach(function (b) { if (cnt[b.s] != null) cnt[b.s]++; });
  var s = el('div', 'search'); s.appendChild(icon('search'));
  var q = el('input'); q.type = 'search'; q.placeholder = 'Ism, telefon yoki masala'; q.value = state.q; q.setAttribute('aria-label', 'Qidiruv');
  q.oninput = function () { state.q = q.value; renderListBody(all, today, true); };
  s.appendChild(q); view.appendChild(s);
  var chips = el('div', 'chips'); chips.setAttribute('role', 'group'); chips.setAttribute('aria-label', 'Holat bo‘yicha filtr');
  [['all', 'Barchasi'], ['new', 'Kutilmoqda'], ['ok', 'Tasdiqlangan'], ['no', 'Rad etilgan']].forEach(function (f) {
    var b = el('button', null, f[1]); add(b, el('b', null, String(cnt[f[0]] || 0))); b.setAttribute('aria-pressed', state.filter === f[0] ? 'true' : 'false');
    b.onclick = function () { state.filter = f[0]; tick(); render(); }; chips.appendChild(b);
  });
  view.appendChild(chips);
  var holder = el('div'); holder.id = 'listbody'; view.appendChild(holder);
  renderListBody(all, today, false);
}
function renderListBody(all, today) {
  var holder = $('listbody'); holder.textContent = '';
  var rows = all.filter(matches).sort(function (a, b) { return b.at - a.at; });
  if (!rows.length) {
    var e = el('div', 'card empty'); var ic = el('div', 'ic'); ic.appendChild(icon('empty'));
    add(e, ic, el('b', null, all.length ? 'Hech narsa topilmadi' : 'Hozircha ariza yo‘q'), el('div', null, all.length ? 'Filtr yoki qidiruvni o‘zgartirib ko‘ring.' : 'Yangi arizalar shu yerda paydo bo‘ladi.'));
    holder.appendChild(e); return;
  }
  var last = null;
  rows.forEach(function (b) {
    var g = groupName(b.at, today);
    if (g !== last) { holder.appendChild(el('div', 'grp', g)); last = g; }
    var it = el('button', 'card item');
    var body = el('div', 'body');
    var when = el('div', 'when', b.d ? '📅 ' + dshort(b.d) + (b.h ? ' · ' + b.h : '') : '📅 Kun tanlanmagan');
    add(when, el('span', 'src', ' · ' + (b.src === 'sayt' ? 'Sayt' : 'Bot')));
    add(body, el('div', 'nm', b.n || '—'), el('div', 'sub', b.t || ''), when);
    var side = el('div', 'side'); add(side, pill(b.s));
    add(it, el('div', 'av', initials(b.n)), body, side);
    it.onclick = function () { openSheet(b); };
    holder.appendChild(it);
  });
}

/* ---------- Statistika ---------- */
function renderStats(all, today) {
  var startDay = Date.parse(today + 'T00:00:00Z') - 5 * 3600000;
  var c = { 'new': 0, ok: 0, no: 0 }; all.forEach(function (b) { if (c[b.s] != null) c[b.s]++; });
  var todayN = all.filter(function (b) { return b.at >= startDay; }).length;
  var hero = el('div', 'card hero'); var l = el('div'); add(l, el('b', null, String(all.length)), el('span', null, 'Jami arizalar'));
  add(hero, l, el('div', 'today', 'Bugun: +' + todayN)); view.appendChild(hero);
  var k = el('div', 'kpis');
  [['new', 'Kutilmoqda', 'var(--warn)'], ['ok', 'Tasdiqlangan', 'var(--good)'], ['no', 'Rad etilgan', 'var(--crit)']].forEach(function (x) {
    var card = el('div', 'card kpi'); var sp = el('span'); var dot = el('i'); dot.style.background = x[2]; add(sp, dot, document.createTextNode(x[1]));
    add(card, el('b', null, String(c[x[0]])), sp); k.appendChild(card);
  });
  view.appendChild(k);

  view.appendChild(el('h2', null, 'Kelgusi 10 ish kuni'));
  var days = workDays(today, 10), cnt = {}; all.forEach(function (b) { if (b.d && b.s !== 'no') cnt[b.d] = (cnt[b.d] || 0) + 1; });
  var max = Math.max(1, Math.max.apply(null, days.map(function (d) { return cnt[d] || 0; })));
  var wrap = el('div', 'card pad'), cols = el('div', 'cols');
  days.forEach(function (d) {
    var n = cnt[d] || 0, p = dparts(d), col = el('div', 'col' + (d === today ? ' today' : '')); col.title = dlabel(d) + ': ' + n + ' ta';
    var bar = el('div', 'bar' + (n ? '' : ' zero')); bar.style.height = n ? Math.max(6, n / max * 100) + 'px' : '2px';
    add(col, el('div', 'v', String(n)), bar, el('div', 'x', p.d + '.' + two(p.m + 1) + '\n' + WDS[p.w])); cols.appendChild(col);
  });
  add(wrap, cols, el('div', 'axis')); view.appendChild(wrap);

  view.appendChild(el('h2', null, 'Manba'));
  var bot = all.filter(function (b) { return b.src === 'bot'; }).length, site = all.length - bot;
  view.appendChild(barList([['Telegram bot', bot], ['Veb-sayt', site]]));

  view.appendChild(el('h2', null, 'Masalalar bo‘yicha'));
  var t = {}; all.forEach(function (b) { if (b.s !== 'no') { var k2 = b.t || 'Boshqa'; t[k2] = (t[k2] || 0) + 1; } });
  var keys = Object.keys(t).sort(function (a, b) { return t[b] - t[a]; });
  view.appendChild(keys.length ? barList(keys.map(function (x) { return [x, t[x]]; })) : (function () { var e = el('div', 'card empty'); e.appendChild(el('div', null, 'Hozircha ma’lumot yo‘q')); return e; })());
}
function barList(pairs) {
  var wrap = el('div', 'card pad bars'), max = Math.max(1, Math.max.apply(null, pairs.map(function (p) { return p[1]; })));
  pairs.forEach(function (p) {
    var r = el('div', 'r'), l = el('div', 'l'), tr = el('div', 'tr'), i = el('i'); i.style.width = (p[1] / max * 100) + '%';
    add(l, el('span', null, p[0]), el('span', null, String(p[1]))); add(tr, i); add(r, l, tr); wrap.appendChild(r);
  });
  return wrap;
}

/* ---------- Batafsil oyna ---------- */
function openSheet(b) {
  var s = $('sheet'); s.textContent = '';
  add(s, el('div', 'grab'), el('h3', null, b.n || '—'), pill(b.s));
  var dl = el('dl', 'dl');
  function row(k, v) { var r = el('div'); add(r, el('dt', null, k), el('dd', null, v)); dl.appendChild(r); }
  row('Telefon', b.p || '—');
  row('Masala', b.t || '—');
  row('Qabul vaqti', b.d ? dlabel(b.d) + (b.h ? ', ' + b.h : '') : 'Kun tanlanmagan');
  row('Izoh', b.c ? b.c + (String(b.c).length >= 100 ? '…' : '') : '—');
  row('Manba', b.src === 'sayt' ? 'Veb-sayt' : 'Telegram bot');
  row('Yuborilgan', b.at ? stamp(b.at) : '—');
  s.appendChild(dl);
  var call = el('a', 'big'); call.href = phoneHref(b.p); add(call, icon('phone'), document.createTextNode('Qo‘ng‘iroq qilish')); s.appendChild(call);
  var cl = el('button', 'close', 'Yopish'); cl.onclick = closeSheet; s.appendChild(cl);
  $('scrim').classList.add('on'); s.classList.add('on'); tick();
  try { tg.BackButton.show(); tg.BackButton.onClick(closeSheet); } catch (e) {}
}
function closeSheet() {
  $('scrim').classList.remove('on'); $('sheet').classList.remove('on');
  try { tg.BackButton.hide(); tg.BackButton.offClick(closeSheet); } catch (e) {}
}
$('scrim').onclick = closeSheet;
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

/* ---------- Asosiy ---------- */
function render() {
  var d = state.data; if (!d) return;
  var all = d.bookings || [], slots = d.slots || [], today = todayISO();
  var keepPos = window.scrollY;
  $('sub').textContent = dlabel(today) + ' · yangilandi ' + two(new Date(state.at + 5 * 3600000).getUTCHours()) + ':' + two(new Date(state.at + 5 * 3600000).getUTCMinutes());
  drawTabs(); view.textContent = '';
  if (state.tab === 'jadval') renderSchedule(all, slots, today);
  else if (state.tab === 'arizalar') renderList(all, today);
  else renderStats(all, today);
  window.scrollTo(0, keepPos);
}

$('refresh').onclick = function () { tick(); load(); };
document.addEventListener('visibilitychange', function () { if (!document.hidden && state.data && Date.now() - state.at > 30000) load(); });
load();
})();
</script>
</body>
</html>
